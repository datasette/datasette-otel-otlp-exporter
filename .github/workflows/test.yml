name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    # TODO: drop the [tool.uv.sources] pin in pyproject.toml once a datasette
    # alpha ships the phase-1 otel spans; until then uv resolves datasette from
    # the branch pinned there.
    - run: uv run pytest
