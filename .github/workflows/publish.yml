name: Publish Python Package

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    # TODO: unpin when a datasette 1.0aXX alpha ships the phase-1 otel spans
    - run: |
        uv run --no-project --isolated \
          --with-editable . \
          --with "datasette @ git+https://github.com/simonw/datasette@asg017/otel-phase1-4-otlp-demo" \
          --with pytest --with pytest-asyncio --with opentelemetry-proto \
          pytest
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
    - uses: actions/checkout@v5
    - uses: astral-sh/setup-uv@v7
      with:
        python-version: "3.12"
    - name: Build package
      run: |
        uv build
    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
