[project]
name = "datasette-otel-otlp-exporter"
version = "0.1.0a1"
description = "Export Datasette's OpenTelemetry spans to any OTLP backend"
readme = "README.md"
authors = [{name = "Alex Garcia"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.10"
dependencies = [
    "datasette>=1.0a41",
    "pydantic>=2.6",
    "opentelemetry-sdk>=1.37",
    "opentelemetry-exporter-otlp-proto-http>=1.37",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/datasette/datasette-otel-otlp-exporter"
Changelog = "https://github.com/datasette/datasette-otel-otlp-exporter/releases"
Issues = "https://github.com/datasette/datasette-otel-otlp-exporter/issues"
CI = "https://github.com/datasette/datasette-otel-otlp-exporter/actions"

[project.entry-points.datasette]
otel_otlp_exporter = "datasette_otel_otlp_exporter"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "opentelemetry-proto",
    "ruff>=0.16.8",
    "ty>=0.0.84",
]

[tool.setuptools.packages.find]
include = ["datasette_otel_otlp_exporter*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
